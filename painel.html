<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel Avançado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13;
            color: #ffffff;
            padding: 16px;
            padding-top: 80px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px;
        }

        /* BARRA DO TOPO FIXA COMPLETA */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #111622;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 999999;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left img {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: 1px solid #0066ff;
            object-fit: cover;
        }

        .nav-left span {
            font-size: 14px;
            font-weight: 600;
        }

        .nav-right-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 102, 255, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
        }

        /* Botão Três Pontinhos Manual Independente */
        .menu-trigger-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        /* Menu Suspenso (Dropdown) */
        .custom-dropdown {
            display: none;
            position: absolute;
            top: 60px;
            right: 16px;
            background-color: #161b26;
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 8px;
            width: 190px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 1000000;
        }

        .menu-link {
            display: block;
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .menu-link:last-child {
            border-bottom: none;
            color: #f87171;
        }

        /* CABEÇALHO CENTRAL */
        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 2px solid #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
            object-fit: cover;
            margin-bottom: 12px;
        }

        .header-section h2 { font-size: 22px; font-weight: 700; }
        .header-section p { color: #64748b; font-size: 13px; }

        /* PAINEL DE CARTÕES (DASHBOARD) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #161b26;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
        }

        .stat-card:active {
            border-color: #0066ff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.5);
        }

        .card-icon-box {
            width: 32px;
            height: 32px;
            background: #0066ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .stat-card p { color: #64748b; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .stat-card .sub-text { color: #38bdf8; font-size: 12px; margin-top: 4px; }

        /* SEÇÃO EDITAR LUCRO (SEGUNDA A DOMINGO) */
        .section-box {
            background: #161b26;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #38bdf8;
        }

        .days-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .day-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .day-row:active {
            border-color: #0066ff;
        }

        .day-name { font-size: 13px; font-weight: 600; }
        .day-val { font-size: 14px; font-weight: 700; color: #10b981; }

        /* FILTRO DE DATA ESPECÍFICA */
        .date-picker-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .date-picker-box input {
            flex: 1;
            padding: 10px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        /* ENTRADAS E BOTÕES */
        .input-box {
            position: relative;
            margin-bottom: 12px;
        }

        .input-box span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; font-weight: 600; }
        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 32px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .backdrop-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="backdrop-mask" id="mascaraGlobal" onclick="toggleMenuGlobal()"></div>

    <!-- NAVBAR COM USUÁRIO E LINKS SOLICITADOS -->
    <nav class="top-navbar">
        <div class="nav-left">
            <img src="assets/images/logo.png" alt="Logo" onerror="this.src='https://placehold.co'">
            <span>Mediadores Vision</span>
        </div>
        
        <div class="nav-right-area">
            <div class="user-badge" id="displayUsuario">ADM-Vision</div>
            <button type="button" class="menu-trigger-btn" onclick="toggleMenuGlobal()">⋮</button>
        </div>

        <div class="custom-dropdown" id="dropdownGlobal">
            <button class="menu-link" onclick="acaoMenu('inicio')">🏠 Início</button>
            <button class="menu-link" onclick="acaoMenu('dashboard')">📊 Dashboard</button>
            <button class="menu-link" onclick="acaoMenu('editar')">📝 Editar Lucros</button>
            <button class="menu-link" onclick="acaoMenu('sair')">↪️ Sair</button>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="header-section">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
            <h2>Painel de Controle</h2>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- DASHBOARD PRINCIPAL COM MÉDIA DIÁRIA SOLICITADA -->
        <div id="area-dashboard" class="stats-grid">
            <div class="stat-card">
                <div class="card-icon-box">📅</div>
                <p>Lucro Diário</p>
                <div class="value" id="lucro-diario">R$ 0,00</div>
            </div>

            <div class="stat-card">
                <div class="card-icon-box">📊</div>
                <p>Lucro Semanal</p>
                <div class="value" id="lucro-semanal">R$ 0,00</div>
            </div>

            <div class="stat-card">
                <div class="card-icon-box">📈</div>
                <p>Média Diária da Semana</p>
                <div class="value" id="lucro-media" style="color: #10b981;">R$ 0,00</div>
            </div>

            <div class="stat-card">
                <div class="card-icon-box">🔥</div>
                <p>Melhor Dia</p>
