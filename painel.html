<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel de Controle</title>
    <style>
        /* Configurações Gerais de Cores (Tema Escuro e Azul) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        /* --- BARRA TOPO FIXA --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar-left img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
        }

        .top-bar-left h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .user-id {
            font-size: 13px;
            color: #666d7a;
        }

        .btn-menu-trigger {
            background: none;
            border: none;
            color: #666d7a;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
        }

        /* --- MENU FLUTUANTE (AZUL) --- */
        .dropdown-menu {
            position: absolute;
            top: 45px;
            right: 0;
            background-color: #121318;
            border: 1px solid #0066ff; /* Borda Azul como você pediu */
            border-radius: 12px;
            width: 180px;
            display: none; /* Escondido por padrão */
            flex-direction: column;
            padding: 6px;
            z-index: 100;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background-color: #1c1e24;
            color: #0066ff;
        }

        .dropdown-item.logout {
            color: #ff4444;
            border-top: 1px solid #1c1e24;
            border-radius: 0 0 8px 8px;
        }

        /* --- SEÇÕES DAS TELAS --- */
        .app-page {
            display: none; /* Esconde todas as telas inicialmente */
        }

        .app-page.active {
            display: block; /* Mostra apenas a tela ativa */
        }

        /* Card temporário para teste */
        .placeholder-card {
            background: #121318;
            border: 1px solid #1c1e24;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            color: #666d7a;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Barra de Topo que nunca muda -->
        <header class="top-bar">
            <div class="top-bar-left">
                <!-- Sua imagem existente configurada abaixo -->
                <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
                <h2>Mediadores Vision</h2>
            </div>
            <div class="top-bar-right">
                <span class="user-id">222</span>
                <button class="btn-menu-trigger" onclick="alternarMenu()">⋮</button>
                
                <!-- Menu de Opções Azul -->
                <nav class="dropdown-menu" id="menuFlutuante">
                    <button class="dropdown-item" onclick="mudarTela('inicio')">🏠 Início</button>
                    <button class="dropdown-item" onclick="mudarTela('dashboard')">📊 Dashboard</button>
                    <button class="dropdown-item" onclick="mudarTela('editar')">📝 Editar Lucros</button>
                    <button class="dropdown-item" onclick="mudarTela('config')">⚙️ Configurações</button>
                    <button class="dropdown-item logout" onclick="alert('Saindo...')">🚪 Sair</button>
                </nav>
            </div>
        </header>

        <!-- AREA DAS TELAS DINÂMICAS -->
        
        <!-- 1. TELA INÍCIO -->
        <main class="app-page active" id="page-inicio">
            <div class="placeholder-card">
                <h3>Tela Inicial</h3>
                <p>Aqui entrarão os primeiros cards de lucro diário e hora.</p>
            </div>
        </main>

        <!-- 2. TELA DASHBOARD SEMANAL -->
        <main class="app-page" id="page-dashboard">
            <div class="placeholder-card">
                <h3>Dashboard Semanal</h3>
                <p>Aqui entrará a grade de 7 dias e o gráfico de barras.</p>
            </div>
        </main>

        <!-- 3. TELA EDITAR LUCROS -->
        <main class="app-page" id="page-editar">
            <div class="placeholder-card">
                <h3>Editar Lucros Avançado</h3>
                <p>Aqui entrará o seletor de calendário e reset de semana.</p>
            </div>
        </main>

        <!-- 4. TELA CONFIGURAÇÕES -->
        <main class="app-page" id="page-config">
            <div class="placeholder-card">
                <h3>Configurações</h3>
                <p>Configurações gerais do sistema.</p>
            </div>
        </main>

    </div>

    <script>
        // Função para abrir e fechar o menu de 3 pontinhos
        function alternarMenu() {
            const menu = document.getElementById('menuFlutuante');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // Função inteligente para trocar de tela sem recarregar a página
        function mudarTela(idTela) {
            // Esconde todas as páginas
            document.querySelectorAll('.app-page').forEach(pagina => {
                pagina.classList.remove('active');
            });
            
            // Mostra apenas a página clicada
            document.getElementById(`page-${idTela}`).classList.add('active');
            
            // Fecha o menu automaticamente após clicar
            document.getElementById('menuFlutuante').style.display = 'none';
        }

        // Fecha o menu se o usuário clicar em qualquer lugar fora dele
        window.onclick = function(event) {
            if (!event.target.matches('.btn-menu-trigger')) {
                document.getElementById('menuFlutuante').style.display = 'none';
            }
        }
    </script>
</body>
</html>
