<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision - Painel de Controle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13;
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        .header-card {
            background: linear-gradient(135deg, #141b2d 0%, #0d1323 100%);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-card img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 2px solid #0066ff;
            object-fit: cover;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(22, 27, 38, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-card.highlight {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.15) 0%, rgba(22, 27, 38, 0.8) 100%);
            border: 1px solid rgba(0, 102, 255, 0.4);
        }

        .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .icon-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
        .highlight .icon-dot { background: #0066ff; }
        .blue-dot { background: #38bdf8; }
        .green-dot { background: #10b981; }

        .stat-card p { color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: 700; }
        .highlight .value { font-size: 32px; }

        .action-card {
            background: #121824;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
        }

        .input-wrapper { position: relative; margin-bottom: 16px; }
        .input-wrapper span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-weight: 600; }
        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 16px;
            background: #0066ff;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-card">
            <img src="https://unsplash.com" alt="Vision Logo">
            <div>
                <h2>Painel de Controle</h2>
                <p style="color: #64748b; font-size: 13px;">Gerencie seus lucros com profissionalismo</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="card-top"><div class="icon-dot blue-dot"></div><p>Lucro Diário</p></div>
                <div class="value" id="lucro-diario">R$ 0,00</div>
            </div>
            <div class="stat-card">
                <div class="card-top"><div class="icon-dot green-dot"></div><p>Lucro Mensal</p></div>
                <div class="value" id="lucro-mesal">R$ 0,00</div>
            </div>
            <div class="stat-card highlight">
                <div class="card-top"><div class="icon-dot"></div><p>Faturamento Semanal</p></div>
                <div class="value" id="lucro-semanal">R$ 0,00</div>
            </div>
        </div>

        <div class="action-card">
            <h3 style="font-size: 15px; margin-bottom: 16px;">Inserir Faturamento Diário</h3>
            <div class="input-wrapper">
                <span>R$</span>
                <input type="number" id="valor-input" placeholder="0,00" step="0.01" inputmode="decimal">
            </div>
            <button type="button" class="btn-blue" onclick="calcularFaturamento()">Calcular Ganhos</button>
        </div>

        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Sair do Painel</button>
    </div>

    <script>
        function calcularFaturamento() {
            const input = document.getElementById('valor-input');
            const valorDiario = parseFloat(input.value);

            if (isNaN(valorDiario) || valorDiario <= 0) {
                alert("Por favor, insira um valor válido.");
                return;
            }

            const valorSemanal = valorDiario * 7;
            const valorMensal = valorDiario * 30;

            document.getElementById('lucro-diario').innerText = valorDiario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('lucro-semanal').innerText = valorSemanal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('lucro-mesal').innerText = valorMensal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            input.value = '';
        }
    </script>
</body>
</html>
