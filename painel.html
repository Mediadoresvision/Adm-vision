<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel</title>
    <style>
        /* --- CONFIGURAÇÕES GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        /* --- BARRA SUPERIOR INSTITUCIONAL --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar-left img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
        }

        .top-bar-left h2 { font-size: 15px; font-weight: 700; }
        .top-bar-right { display: flex; align-items: center; gap: 12px; position: relative; }
        .user-id { font-size: 13px; color: #666d7a; font-weight: 600; }
        .btn-menu-trigger { background: none; border: none; color: #666d7a; font-size: 22px; cursor: pointer; padding: 0 4px; }

        /* Menu de Opções Azul */
        .dropdown-menu {
            position: absolute;
            top: 45px;
            right: 0;
            background-color: #121318;
            border: 1px solid #0066ff;
            border-radius: 12px;
            width: 180px;
            display: none;
            flex-direction: column;
            padding: 6px;
            z-index: 100;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
        }

        .dropdown-item:hover { background-color: #1c1e24; color: #0066ff; }
        .dropdown-item.logout { color: #ff4444; border-top: 1px solid #1c1e24; }

        /* Chaveamento de Páginas */
        .app-page { display: none; }
        .app-page.active { display: block; }

        /* --- BANNER DE BOAS-VINDAS --- */
        .banner-welcome {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            text-align: left;
        }

        .banner-welcome img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .banner-text h3 { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
        .banner-text p { color: #666d7a; font-size: 12px; }

        /* --- CARDS DE DUAS COLUNAS COM ÍCONES INTERNOS --- */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-icon-box {
            width: 24px;
            height: 24px;
            background-color: rgba(0, 102, 255, 0.1);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0066ff;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .card-label {
            color: #666d7a;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .card-value { font-size: 20px; font-weight: 700; color: #ffffff; }
        .card-sub { color: #666d7a; font-size: 11px; margin-top: 2px; }

        /* --- ENTRADAS DE DADOS E SEÇÕES --- */
        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #666d7a;
            margin-bottom: 8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-block-container {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .input-block-container span { color: #0066ff; font-weight: 700; }
        .input-block-container input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            font-size: 14px;
        }

        .btn-blue-primary {
            width: 100%;
            padding: 14px;
            background-color: #0066ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-red-secondary {
            width: 100%;
            padding: 14px;
            background-color: #ff4444;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
        }

        .btn-gray-navigation {
            width: 100%;
            padding: 14px;
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        /* --- SEÇÃO DE DASHBOARD --- */
        .weekly-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-card {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }
        .day-card h4 { font-size: 10px; font-weight: 700; color: #ffffff; text-transform: uppercase; }
        .day-card span { font-size: 9px; color: #666d7a; display: block; margin: 2px 0 6px 0; }
        .day-card p { font-size: 13px; font-weight: 700; color: #0066ff; }

        .chart-box {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .chart-placeholder {
            height: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10px 20px 0 20px;
            border-bottom: 1px solid #1c1e24;
            margin-top: 15px;
        }
        .chart-bar { width: 14px; background-color: #0066ff; border-radius: 3px 3px 0 0; height: 10%; transition: height 0.5s ease; }
        .chart-labels { display: flex; justify-content: space-between; padding: 6px 16px 0 16px; font-size: 9px; color: #666d7a; }

        /* --- SEÇÃO EDITAR LUCROS --- */
        .edit-card-box {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-log-text { text-align: center; color: #666d7a; font-size: 13px; margin-top: 25px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA FIXA SUPERIOR -->
        <header class="top-bar">
            <div class="top-bar-left">
                <img src="assets/images/logo.png" alt="Vision Logo">
                <h2>Mediadores Vision</h2>
            </div>
            <div class="top-bar-right">
                <span class="user-id" id="exibir-id">Usuario</span>
                <button type="button" class="btn-menu-trigger" onclick="alternarMenu(event)">⋮</button>
                
                <nav class="dropdown-menu" id="menuFlutuante">
                    <div class="dropdown-item" onclick="mudarTela('inicio')">🏠 Início</div>
                    <div class="dropdown-item" onclick="mudarTela('dashboard')">📊 Dashboard</div>
                    <div class="dropdown-item" onclick="mudarTela('editar')">📝 Editar Lucros</div>
                    <div class="dropdown-item logout" onclick="deslogar()">🚪 Sair</div>
                </nav>
            </div>
        </header>

        <!-- ================= 1. TELA DE INÍCIO ================= -->
        <div class="app-page active" id="page-inicio">
            <div class="banner-welcome">
                <img src="assets/images/logo.png" alt="Vision Logo Large">
                <div class="banner-text">
