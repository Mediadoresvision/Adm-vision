<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision - Painel de Controle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13;
            color: #ffffff;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        /* Cabeçalho Principal */
        .header-card {
            background: #111622;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-card img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid #0066ff;
            object-fit: cover;
        }

        .header-text h2 { font-size: 16px; font-weight: 600; }
        .header-text p { color: #64748b; font-size: 12px; }

        /* Grade União dos 3 Primeiros Blocos Lado a Lado */
        .top-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: #111622;
            padding: 12px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Cartão Semanal Todo Azul igual ao da foto */
        .stat-card.highlight-blue {
            background: #0052cc;
            border: 1px solid #0066ff;
        }

        .card-icon-area {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }

        .icon-square {
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .stat-card p {
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .highlight-blue p { color: #e2e8f0; }

        .stat-card .value {
            font-size: 15px;
            font-weight: 700;
            margin-top: 4px;
            word-break: break-all;
        }

        .stat-card .sub-date {
            color: #64748b;
            font-size: 9px;
            margin-top: 2px;
        }

        /* Cartão de Hora Atual Largo */
        .wide-card {
            background: #111622;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
        }

        .wide-card .time-value {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
        }

        .wide-card .countdown-text {
            color: #00a3ff;
            font-size: 11px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Cartões de Ação (+ Adicionar Lucro / Ações Rápidas) */
        .action-container {
            background: #111622;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
        }

        .action-container.blue-theme {
            background: #0d1e36;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }

        .action-title {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .blue-theme .action-title { color: #38bdf8; }

        .input-box {
            position: relative;
            margin-bottom: 12px;
        }

        .input-box span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 36px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .btn-submit-action {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cyan-action {
            width: 100%;
            padding: 12px;
            background: #00a3ff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Cabeçalho -->
        <div class="header-card">
            <img src="https://unsplash.com" alt="Vision Logo">
            <div class="header-text">
                <h2>Painel de Controle</h2>
                <p>Gerencie seus lucros com profissionalismo</p>
            </div>
        </div>

        <!-- 3 Cartões de Cima Lado a Lado -->
        <div class="top-stats-grid">
            <!-- Bloco 1: Lucro Diário -->
            <div class="stat-card">
                <div class="card-icon-area"><div class="icon-square"></div></div>
                <div>
                    <p>Lucro Diário</p>
                    <div class="value" id="lucro-diario">R$ 0,00</div>
                </div>
            </div>

            <!-- Bloco 2: Lucro Semanal (Azul da foto) -->
            <div class="stat-card highlight-blue">
                <div class="card-icon-area"><div class="icon-square"></div></div>
                <div>
                    <p>Lucro Semanal</p>
                    <div class="value" id="lucro-semanal">R$ 0,00</div>
                </div>
            </div>

            <!-- Bloco 3: Dia da Semana -->
            <div class="stat-card">
                <div class="card-icon-area"><div class="icon-square"></div></div>
                <div>
                    <p>Dia da Semana</p>
                    <div class="value" id="dia-texto" style="font-size: 13px;">...</div>
                    <div class="sub-date" id="data-texto">00/00/2026</div>
                </div>
            </div>
        </div>

        <!-- Bloco Largo: Hora Atual -->
        <div class="wide-card">
            <div class="card-icon-area" style="margin-bottom: 6px;"><div class="icon-square" style="width:12px; height:12px; border-radius:50%;"></div><p style="margin-left:6px;">Hora Atual</p></div>
            <div class="time-value" id="relogio-texto">00:00:00</div>
            <div class="countdown-text" id="tempo-restante">Faltam 4h 57m 45s para encerrar o dia</div>
        </div>

        <!-- Bloco Adicionar Lucro -->
        <div class="action-container">
            <div class="action-title">🔹 + Adicionar Lucro</div>
            <div class="input-box">
                <span>$</span>
                <input type="number" id="valor-input" placeholder="Valor do lucro (ex: 100.50)" step="0.01" inputmode="decimal">
            </div>
            <button type="button" class="btn-submit-action" onclick="calcularFaturamento()">+ Adicionar Lucro</button>
        </div>

        <!-- Bloco Azul de Ações Rápidas (Igual à foto) -->
        <div class="action-container blue-theme">
            <div class="action-title">🔹 Ações Rápidas</div>
            <button type="button" class="btn-cyan-action" onclick="zerarSistema()">🔄 Zerar Sistema / Sair</button>
        </div>

    </div>

    <script>
        function atualizarPainelTempo() {
            const agora = new Date();
            
            // Relógio
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-texto').innerText = `${horas}:${minutos}:${segundos}`;

            // Data
            const diaNum = String(agora.getDate()).padStart(2, '0');
            const mesNum = String(agora.getMonth() + 1).padStart(2, '0');
            const anoNum = agora.getFullYear();
            document.getElementById('data-texto').innerText = `${diaNum}/${mesNum}/${anoNum}`;

            // Dia por Extenso
            const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            document.getElementById('dia-texto').innerText = diasSemana[agora.getDay()];

            // Cálculo do tempo que falta para encerrar o dia (meia-noite)
            const faltaHoras = 23 - agora.getHours();
            const faltaMinutos = 59 - agora.getMinutes();
            const faltaSegundos = 59 - agora.getSeconds();
            document.getElementById('tempo-restante').innerText = `Faltam ${faltaHoras}h ${faltaMinutos}m ${faltaSegundos}s para encerrar o dia`;
        }

        // Inicia e atualiza o relógio a cada segundo
