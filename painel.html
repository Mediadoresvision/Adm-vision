<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Apostas - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13; /* Fundo azul escuro profundo */
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px; /* Permite esticar perfeitamente no computador */
        }

        /* Cabeçalho Centralizado Vision */
        .header-section {
            text-align: center;
            margin-bottom: 24px;
            padding: 10px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            border: 2px solid #0066ff; /* Borda Azul Vision */
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .header-section h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-section p {
            color: #64748b;
            font-size: 13px;
        }

        /* ================= GRADE DE CARTÕES ADAPTÁVEL ================= */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr; /* Padrão Celular: Um embaixo do outro */
            gap: 14px;
            margin-bottom: 20px;
        }

        /* Cartão Base Escuro */
        .stat-card {
            background: #161b26; /* Cor do painel Vision */
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Área do ícone azul quadrado */
        .card-icon-box {
            width: 32px;
            height: 32px;
            background: #0066ff; /* Azul Vision */
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
        }

        .stat-card p {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 6px;
        }

        .stat-card .sub-text {
            color: #38bdf8; /* Azul claro para dados de tempo */
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Blocos de Entrada e Ações */
        .action-card {
            background: #161b26;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 16px;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-box {
            position: relative;
            margin-bottom: 14px;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-weight: 600;
        }

        .input-box input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .input-box input:focus {
            border-color: #0066ff;
        }

        /* Botão Azul Grande */
        .btn-blue {
            width: 100%;
            padding: 14px;
            background: #0066ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
            transition: background 0.2s;
        }

        .btn-blue:active {
            background: #0052cc;
        }

        /* ================= CONFIGURAÇÃO EXCLUSIVA PARA COMPUTADOR ================= */
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr; /* 4 colunas deitadas no PC */
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Cabeçalho Vision -->
        <div class="header-section">
            <img src="https://unsplash.com" alt="Vision Logo">
            <h2>Painel de Controle</h2>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- Grade Dinâmica: Em pé no celular, deitada no PC -->
        <div class="stats-grid">
            
            <!-- Lucro Diário -->
            <div class="stat-card">
                <div>
                    <div class="card-icon-box">📅</div>
                    <p>Lucro Diário</p>
                    <div class="value" id="lucro-diario">R$ 0,00</div>
                </div>
            </div>

            <!-- Lucro Semanal -->
            <div class="stat-card">
                <div>
                    <div class="card-icon-box">📊</div>
                    <p>Lucro Semanal</p>
                    <div class="value" id="lucro-semanal">R$ 0,00</div>
                </div>
            </div>

            <!-- Dia da Semana -->
            <div class="stat-card">
                <div>
                    <div class="card-icon-box">📆</div>
                    <p>Dia da Semana</p>
                    <div class="value" id="dia-texto">...</div>
                    <div class="sub-text" id="data-texto" style="color: #64748b; font-size: 12px; margin-top: 6px;">00-00-2026</div>
                </div>
            </div>

            <!-- Hora Atual -->
            <div class="stat-card">
                <div>
                    <div class="card-icon-box">🕒</div>
                    <p>Hora Atual</p>
                    <div class="value" id="relogio-texto" style="color: #38bdf8;">00:00:00</div>
                    <div class="sub-text" id="tempo-restante">Faltam 00h 00min 00s</div>
                </div>
            </div>

        </div>

        <!-- Área de Adicionar Lucros -->
        <div class="action-card">
            <div class="action-title">🔹 Adicionar Lucro</div>
            <div class="input-box">
                <span>$</span>
                <input type="number" id="valor-input" placeholder="Valor do lucro (ex: 100,50)" step="0.01" inputmode="decimal">
            </div>
            <button type="button" class="btn-blue" onclick="calcularFaturamento()">+ Adicionar Lucro</button>
        </div>

    </div>

    <script>
        function sistemaTempo() {
            const agora = new Date();
            
            // Relógio
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutes = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('relogio-texto').innerText = `${horas}:${minutes}:${segundos}`;

            // Data com traços
            const diaNum = String(agora.getDate()).padStart(2, '0');
            const mesNum = String(agora.getMonth() + 1).padStart(2, '0');
            const anoNum = agora.getFullYear();
            document.getElementById('data-texto').innerText = `${diaNum}-${mesNum}-${anoNum}`;

            // Nome do dia
            const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            document.getElementById('dia-texto').innerText = diasSemana[agora.getDay()];

            // Tempo restante para acabar o dia
            const faltaHoras = 23 - agora.getHours();
            const faltaMinutos = 59 - agora.getMinutes();
            const faltaSegundos = 59 - agora.getSeconds();
            document.getElementById('tempo-restante').innerText = `Faltam ${faltaHoras}h ${faltaMinutos}min ${faltaSegundos}s`;
        }

        sistemaTempo();
        setInterval(sistemaTempo, 1000);

        function calcularFaturamento() {
            const input = document.getElementById('valor-input');
            const valorDiario = parseFloat(input.value);

            if (isNaN(valorDiario) || valorDiario <= 0) {
                alert("Por favor, digite um valor válido.");
                return;
            }

            const valorSemanal = valorDiario * 7;

            document.getElementById('lucro-diario').innerText = valorDiario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('lucro-semanal').innerText = valorSemanal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            input.value = '';
        }
    </script>
</body>
</html>
