<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Apostas - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13; /* Fundo azul escuro profundo */
            color: #ffffff;
            min-height: 100vh;
            padding-top: 80px; /* Garante que a navbar não cubra nada */
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ================= BARRA DO TOPO FIXA ================= */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #111622;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10000; /* Camada ultra alta para nunca travar */
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left img {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: 1px solid #0066ff;
        }

        .nav-left span {
            font-size: 14px;
            font-weight: 600;
        }

        /* Botão Três Pontinhos Ajustado para Toque Rápido */
        .menu-dots-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10002;
        }

        /* Caixinha do Menu Suspenso */
        .dropdown-menu {
            display: none; 
            position: absolute;
            top: 55px;
            right: 16px;
            background-color: #161b26;
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            overflow: hidden;
            z-index: 10005;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .dropdown-item:last-child {
            border-bottom: none;
            color: #f87171;
        }

        .dropdown-item:active {
            background-color: rgba(0, 102, 255, 0.2);
        }

        /* ================= CONTEÚDO PRINCIPAL ================= */
        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            padding: 16px;
        }

        /* Foto Centralizada Grande */
        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            border: 2px solid #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .header-section h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .header-section p { color: #64748b; font-size: 13px; }

        /* Grade de Cartões */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        /* ================= EFEITO DE AURA AZUL AO CLICAR (TOUCH) ================= */
        .stat-card, .action-card {
            background: #161b26;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Quando o usuário clica ou toca no cartão, a aura azul aparece */
        .stat-card:active, .action-card:active, .stat-card:focus-within {
            border-color: #0066ff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.5);
            transform: scale(0.99);
        }

        .card-icon-box {
            width: 32px;
            height: 32px;
            background: #0066ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
        }

        .stat-card p { color: #94a3b8; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .stat-card .value { font-size: 24px; font-weight: 700; margin-top: 6px; }
        .stat-card .sub-text { color: #38bdf8; font-size: 12px; margin-top: 6px; font-weight: 500; }

        /* Área de Inputs */
        .action-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
        .input-box { position: relative; margin-bottom: 14px; }
        .input-box span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-weight: 600; }
        .input-box input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 14px;
            background: #0066ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Camada para fechar o menu clicando fora */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        /* ================= VERSÃO COMPUTADOR DEITADO ================= */
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 16px;
            }
            .stat-card:hover, .action-card:hover {
                border-color: #0066ff;
                box-shadow: 0 0 15px rgba(0, 102, 255, 0.4);
            }
        }
    </style>
</head>
<body>

    <!-- Camada invisível de fechamento -->
    <div class="menu-overlay" id="overlay-menu" onclick="alternarMenu()"></div>

    <!-- Barra do Topo Fixa -->
    <nav class="top-navbar">
        <div class="nav-left">
            <img src="https://unsplash.com" alt="Logo">
            <span>Mediadores Vision</span>
        </div>
        
        <!-- Botão dos 3 Pontinhos Ativo -->
        <button type="button" class="menu-dots-btn" onclick="alternarMenu()">⋮</button>

        <!-- Caixa Flutuante do Menu Suspenso -->
        <div class="dropdown-menu" id="caixa-menu">
            <button class="dropdown-item" onclick="navegarPara('inicio')">🏠 Início</button>
            <button class="dropdown-item" onclick="navegarPara('dashboard')">📊 Dashboard</button>
            <button class="dropdown-item" onclick="navegarPara('editar')">📝 Editar Lucros</button>
            <button class="dropdown-item" onclick="navegarPara('config')">⚙️ Configurações</button>
            <button class="dropdown-item" onclick="navegarPara('sair')">↪️ Sair</button>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <!-- Cabeçalho Principal -->
        <div class="header-section">
            <img src="https://unsplash.com" alt="Vision Logo">
            <h2>Painel de Controle</h2>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- Grade Dinâmica de Cartões (Todos Clicáveis com Aura) -->
        <div class="stats-grid">
            <div class="stat-card" onclick="document.getElementById('valor-input').focus()">
                <div class="card-icon-box">📅</div>
                <p>Lucro Diário</p>
                <div class="value" id="lucro-diario">R$ 0,00</div>
            </div>

            <div class="stat-card" onclick="document.getElementById('valor-input').focus()">
                <div class="card-icon-box">📊</div>
                <p>Lucro Semanal</p>
                <div class="value" id="lucro-semanal">R$ 0,00</div>
            </div>

            <div class="stat-card">
                <div class="card-icon-box">📆</div>
                <p>Dia da Semana</p>
                <div class="value" id="dia-texto">...</div>
                <div class="sub-text" id="data-texto" style="color: #64748b; font-size: 12px; margin-top: 6px;">00-00-2026</div>
            </div>

            <div class="stat-card">
                <div class="card-icon-box">🕒</div>
                <p>Hora Atual</p>
                <div class="value" id="relogio-texto" style="color: #38bdf8;">00:00:00</div>
                <div class="sub-text" id="tempo-restante">Faltam 00h 00min 00s</div>
            </div>
        </div>

        <!-- Bloco de Input de Lucros -->
        <div class="action-card" id="bloco-insercao">
