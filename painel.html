<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Topo */
        .header-logo {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .header-logo img {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 1px solid #1f222a;
            object-fit: cover;
        }

        .header-logo h1 {
            font-size: 20px;
            font-weight: 700;
            margin-top: 12px;
        }

        .header-logo p {
            color: #666d7a;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Grid de Cards */
        .cards-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background-color: #121318;
            border: 1px solid #1c1e24;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card img.icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
        }

        .card-label {
            color: #5c626e;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .card-value.blue {
            color: #2f80ed;
        }

        .card-sub {
            color: #5c626e;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo e Títulos Principais -->
        <div class="header-logo">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
            <h1>Painel de Controle</h1>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- Lista de Cards Vertical -->
        <div class="cards-grid">
            
            <!-- Lucro Diário -->
            <div class="card">
                <img class="icon" src="https://icons8.com" alt="Calendário">
                <div class="card-label">Lucro Diário</div>
                <div class="card-value">R$ 0,00</div>
            </div>

            <!-- Lucro Semanal -->
            <div class="card">
                <img class="icon" src="https://icons8.com" alt="Calendário">
                <div class="card-label">Lucro Semanal</div>
                <div class="card-value">R$ 0,00</div>
            </div>

            <!-- Média Diária -->
            <div class="card">
                <img class="icon" src="https://icons8.com" alt="Gráfico">
                <div class="card-label">Média Diária da Semana</div>
                <div class="card-value blue">R$ 0,00</div>
            </div>

            <!-- Dia da Semana / Data -->
            <div class="card">
                <img class="icon" src="https://icons8.com" alt="Calendário">
                <div class="card-label">Dia da Semana</div>
                <div class="card-value" id="txt-dia-semana">Carregando...</div>
                <div class="card-sub" id="txt-data-completa">00/00/2026</div>
            </div>

            <!-- Hora Atual / Contador -->
            <div class="card">
                <img class="icon" src="https://icons8.com" alt="Relógio">
                <div class="card-label">Hora Atual</div>
                <div class="card-value" id="txt-hora-atual">00:00:00</div>
                <div class="card-sub" id="txt-tempo-restante">Calculando tempo restante...</div>
            </div>

        </div>
    </div>

    <script>
        function atualizarPainel() {
            const agora = new Date();

            // 1. Configuração de Dias da Semana
            const diasSemana = [
                "Domingo", "Segunda-feira", "Terça-feira", 
                "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"
            ];
            
            // 2. Atualiza Dia e Data Sem Bugs
            document.getElementById('txt-dia-semana').innerText = diasSemana[agora.getDay()];
            
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            document.getElementById('txt-data-completa').innerText = `${dia}/${mes}/${ano}`;

            // 3. Atualiza o Relógio Digital em Tempo Real
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            document.getElementById('txt-hora-atual').innerText = `${horas}:${minutos}:${segundos}`;

            // 4. Calcula Quanto Falta Para Acabar o Dia (Faltam Xh Xmin)
            const totalMinutosDoDia = 24 * 60;
            const minutosAtuais = (agora.getHours() * 60) + agora.getMinutes();
            const minutosRestantes = totalMinutosDoDia - minutosAtuais;

            const horasFaltando = Math.floor(minutosRestantes / 60);
            const minutosFaltando = minutosRestantes % 60;

            document.getElementById('txt-tempo-restante').innerText = `Faltam ${horasFaltando}h ${minutosFaltando}min para virar o dia`;
        }

        // Executa a função imediatamente ao carregar a página
        atualizarPainel();
        
        // Atualiza o relógio a cada 1 segundo (1000 milissegundos) de forma contínua
        setInterval(atualizarPainel, 1000);
    </script>
</body>
</html>
