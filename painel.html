<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d; /* Fundo preto idêntico ao print */
            color: #ffffff;
            padding: 16px;
            padding-top: 75px; /* Espaço exato da barra do topo */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px; /* Largura perfeita de celular igual à foto */
        }

        /* ================= BARRA DO TOPO IDÊNTICA À FOTO ================= */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background-color: #141414;
            border-bottom: 1px solid #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 99999;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }

        .nav-left span {
            font-size: 13px;
            font-weight: 600;
        }

        .nav-right-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name-display {
            font-size: 13px;
            font-weight: 600;
            color: #0066ff; /* Nome do usuário em Azul Vision */
        }

        .menu-dots-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
        }

        /* ================= DROPDOWN ALINHADO IGUAL AO PRINT ================= */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 16px;
            background-color: #141414;
            border: 1px solid #262626;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 100000;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #1f1f1f;
        }

        .dropdown-item:last-child {
            border-bottom: none;
            color: #ff4444;
        }

        /* ================= CONTEÚDO CENTRAL ================= */
        .header-section {
            text-align: center;
            margin-bottom: 24px;
            margin-top: 10px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            border: 2px solid #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
            object-fit: cover;
            margin-bottom: 14px;
        }

        .header-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header-section p { color: #666666; font-size: 12px; }

        /* ================= CARTÕES GRANDES EM VERTICAL (IGUAL À FOTO) ================= */
        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #141414; /* Cor idêntica aos blocos da foto */
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Aura azul sutil ao clicar/tocar */
        .stat-card:active, .action-card:active {
            border-color: #0066ff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.4);
        }

        /* Caixa do ícone em AZUL */
        .card-icon-box {
            width: 28px;
            height: 28px;
            background: #0066ff; /* Azul Vision */
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .stat-card p {
            color: #666666;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 4px;
        }

        .stat-card .sub-text {
            color: #666666;
            font-size: 11px;
            margin-top: 4px;
        }

        /* ================= SEÇÕES DE AÇÃO E ENTRADAS ================= */
        .action-card {
            background: #141414;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 12px;
        }

        .action-title {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .input-box {
            position: relative;
            margin-bottom: 12px;
        }

        .input-box span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666666;
            font-weight: 600;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 32px;
            background: #080808;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        /* Botão em AZUL VISION */
        .btn-blue {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Lista de Edição Ocultável por padrão */
        #container-editar-dias {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #141414;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .day-editable-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #080808;
            padding: 12px;
            border-radius: 6px;
        }

        /* Camada invisível de clique fora */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99998;
        }
    </style>
</head>
<body>

    <div class="menu-overlay" id="overlay" onclick="fecharDropdown()"></div>

    <!-- Barra do Topo Igualzinha à Imagem -->
    <nav class="top-navbar">
        <div class="nav-left">
            <img src="assets/images/logo.png" alt="Logo" onerror="this.src='https://placehold.co'">
            <span>Mediadores Vision</span>
        </div>
        
        <div class="nav-right-area">
            <!-- Puxa o nome real do cadastro/login -->
            <div class="user-name-display" id="nomeUsuarioTopo">Carregando...</div>
            <button type="button" class="menu-dots-btn" onclick="abrirDropdown(event)">⋮</button>
        </div>

        <!-- Menu suspenso flutuante livre -->
        <div class="dropdown-menu" id="meuDropdown">
            <button class="dropdown-item" onclick="menuAcao('inicio')">🏠 Início</button>
            <button class="dropdown-item" onclick="menuAcao('dashboard')">📊 Dashboard</button>
            <button class="dropdown-item" onclick="menuAcao('editar')">📝 Editar Lucros</button>
            <button class="dropdown-item" onclick="menuAcao('sair')">↪️ Sair</button>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <!-- Cabeçalho Vision -->
        <div class="header-section">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
            <h2>Painel de Controle</h2>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- Grade Vertical de Cartões -->
        <div class="stats-grid">
            
            <!-- Lucro Diário -->
            <div class="stat-card" onclick="focarInput()">
                <div class="card-icon-box">📅</div>
                <p>Lucro Diário</p>
                <div class="value" id="lucro-diario">R$ 0,00</div>
            </div>

            <!-- Lucro Semanal -->
            <div class="stat-card" onclick="focarInput()">
                <div class="card-icon-box">📅</div>
                <p>Lucro Semanal</p>
                <div class="value" id="lucro-semanal">R$ 0,00</div>
            </div>

            <!-- Média Diária da Semana (Baseada nos valores salvos) -->
            <div class="stat-card">
