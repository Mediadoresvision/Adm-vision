<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #070a13; /* Fundo azul escuro profundo */
            color: #ffffff;
            padding: 16px;
            padding-top: 80px; /* Espaço para a barra fixa não cobrir o conteúdo */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
        }

        /* ================= BARRA DO TOPO FIXA ================= */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #111622;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left img {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: 1px solid #0066ff;
            object-fit: cover;
        }

        .nav-left span {
            font-size: 14px;
            font-weight: 600;
        }

        .menu-dots-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            z-index: 10002;
        }

        /* Caixa do Menu Suspenso (Dropdown) */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            right: 16px;
            background-color: #161b26;
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 10005;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .dropdown-item:last-child {
            border-bottom: none;
            color: #f87171;
        }

        /* ================= CONTEÚDO CENTRAL DO PAINEL ================= */
        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-section img {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            border: 2px solid #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .header-section h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header-section p {
            color: #64748b;
            font-size: 13px;
        }

        /* Grade adaptável: Um embaixo do outro no celular, colunas deitadas no computador */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        /* Modelo de Cartão Largo igual ao print do Quebrada */
        .stat-card {
            background: #161b26; /* Cor escura do padrão Vision */
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Caixa de ícone azul */
        .card-icon-box {
            width: 32px;
            height: 32px;
            background: #0066ff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        /* Efeito de Aura Azul ao clicar/tocar no cartão */
        .stat-card:active, .action-card:active {
            border-color: #0066ff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.6);
        }

        .stat-card p {
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 6px;
        }

        .stat-card .sub-text {
            color: #38bdf8;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Bloco de Entrada */
        .action-card {
            background: #161b26;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .input-box {
            position: relative;
            margin-bottom: 14px;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-weight: 600;
        }

        .input-box input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 14px;
            background: #0066ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Camada invisível de fechamento */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        /* ================= COMPORTAMENTO NO PC DEITADO ================= */
        @media (min-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr; /* Vira 4 colunas deitadas no computador */
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="menu-overlay" id="overlay-menu" onclick="alternarMenu()"></div>

    <!-- Barra do Topo Fixa -->
    <nav class="top-navbar">
        <div class="nav-left">
            <img src="assets/images/logo.png" alt="Logo" onerror="this.src='https://placehold.co'">
            <span>Mediadores Vision</span>
        </div>
        <button type="button" class="menu-dots-btn" onclick="alternarMenu()">⋮</button>

        <div class="dropdown-menu" id="caixa-menu">
            <button class="dropdown-item" onclick="navegarPara('inicio')">🏠 Início</button>
            <button class="dropdown-item" onclick="navegarPara('dashboard')">📊 Dashboard</button>
            <button class="dropdown-item" onclick="navegarPara('editar')">📝 Editar Lucros</button>
            <button class="dropdown-item" onclick="navegarPara('config')">⚙️ Configurações</button>
            <button class="dropdown-item" onclick="navegarPara('sair')">↪️ Sair</button>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <!-- Cabeçalho Vision -->
        <div class="header-section">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
            <h2>Painel de Controle</h2>
            <p>Gerencie seus lucros com profissionalismo</p>
        </div>

        <!-- Grade de Cartões Completos -->
        <div class="stats-grid">
            
            <!-- Lucro Diário -->
            <div class="stat-card" onclick="document.getElementById('valor-input').focus()">
                <div class="card-icon-box">📅</div>
                <p>Lucro Diário</p>
                <div class="value" id="lucro-diario">R$ 0,00</div>
            </div>

            <!-- Lucro Semanal -->
            <div class="stat-card" onclick="document.getElementById('valor-input').focus()">
                <div class="card-icon-box">📊</div>
                <p>Lucro Semanal</p>
                <div class="value" id="lucro-semanal">R$ 0,00</div>
            </div>

            <!-- Dia da Semana -->
            <div class="stat-card">
                <div class="card-icon-box">📆</div>
                <p>Dia da Semana</p>
                <div class="value" id="dia-texto">...</div>
                <div class="sub-text" id="data-texto" style="color: #64748b;">00-00-2026</div>
            </div>

            <!-- Hora Atual -->
            <div class="stat-card">
                <div class="card-icon-box">🕒</div>
                <p>Hora Atual</p>
                <div class="value" id="relogio-texto" style="color: #38bdf8;">00:00:00</div>
