<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Editar Lucros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        /* --- CABEÇALHO TOPO --- */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #1a1d26;
            position: relative;
        }

        .header-brand h2 { font-size: 16px; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1010; }
        .user-badge { font-size: 13px; color: #8a92a6; font-weight: 600; }
        .menu-trigger { background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; padding: 8px 12px; }

        /* Menu de Opções Azul */
        .dropdown-nav {
            position: absolute;
            top: 45px;
            right: 0;
            background-color: #16181f;
            border: 1px solid #0066ff;
            border-radius: 8px;
            width: 170px;
            display: none;
            flex-direction: column;
            padding: 4px;
            z-index: 1050;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
        }

        .nav-item:hover { background-color: #1f222e; color: #0066ff; }
        .nav-item.logout { color: #ff4444; border-top: 1px solid #1a1d26; border-radius: 0; }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        /* --- CARD DE EDIÇÃO (FOTO 4) --- */
        .edit-box {
            background-color: #16181f;
            border: 1px solid #232736;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: #666d7a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            background-color: #0d0e12;
            border: 1px solid #232736;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-row span { color: #0066ff; font-weight: 700; }
        .input-row input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            width: 100%;
            font-size: 14px;
        }

        .input-row input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-full-blue {
            width: 100%;
            padding: 14px;
            background-color: #0066ff;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-full-clear {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 102, 255, 0.1);
            border: 1px solid #0066ff;
            border-radius: 8px;
            color: #0066ff;
            font-weight: 600;
            cursor: pointer;
        }

        .log-feedback {
            text-align: center;
            color: #666d7a;
            font-size: 13px;
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOPO BARRA -->
        <header class="header-top">
            <div class="header-brand">
                <h2>Mediadores Vision</h2>
            </div>
            <div class="header-right">
                <span class="user-badge" id="txt-user-id">---</span>
                <button type="button" class="menu-trigger" onclick="toggleMenu(event)">⋮</button>
                
                <nav class="dropdown-nav" id="boxMenu">
                    <a href="painel.html" class="nav-item">🏠 Início</a>
                    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                    <a href="editar.html" class="nav-item">📝 Editar Lucros</a>
                    <a href="index.html" class="nav-item logout" onclick="deslogar()">🚪 Sair</a>
                </nav>
            </div>
        </header>

        <div class="section-title">📝 Editar Lucros</div>

        <!-- FORMULÁRIO DE EDIÇÃO POR DATA DA SUA FOTO 4 -->
        <div class="edit-box">
            <div class="input-label">📅 Selecione a Data:</div>
            <div class="input-row">
                <input type="date" id="calendar-select" onchange="checarFaturamentoData()">
            </div>

            <div class="input-label" style="margin-top: 20px;">🎯 Adicionar Lucro em Data Específica:</div>
            <div class="input-row">
                <input type="text" id="calendar-day-name" placeholder="Dia correspondente" readonly style="color: #666d7a;">
            </div>
            <div class="input-row">
                <span>$</span>
                <input type="number" id="calendar-money-value" placeholder="Valor (ex: 100,50)" step="0.01">
            </div>

            <button type="button" class="btn-full-blue" onclick="gravarLucroData()">+ Adicionar Lucro</button>
            <button type="button" class="btn-full-clear" onclick="reiniciarTudo()">🔄 Iniciar Nova Semana</button>
        </div>

        <div class="log-feedback" id="txt-feedback">Nenhum lucro encontrado nesta data</div>
    </div>

    <script>
        const chavesDias = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"];
        let carteiraValores = {};

        window.addEventListener('DOMContentLoaded', () => {
            const sessao = localStorage.getItem('sessao_vision') || "Usuário";
            document.getElementById('txt-user-id').innerText = sessao;

            const hoje = new Date();
            document.getElementById('calendar-select').value = hoje.toISOString().split('T')[0];

            carregarBancoGeral();
        });

        function carregarBancoGeral() {
            const user = localStorage.getItem('sessao_vision') || "padrao";
            carteiraValores = JSON.parse(localStorage.getItem('banco_lucros_' + user)) || {
                dom: 0, seg: 0, ter: 0, qua: 0, qui: 0, sex: 0, sab: 0
            };
            checarFaturamentoData();
        }

        function checarFaturamentoData() {
            const dataEscolhida = document.getElementById('calendar-select').value;
            if (!dataEscolhida) return;

            const objData = new Date(dataEscolhida + 'T00:00:00');
            const nomesDiasSemanas = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
            const idDia = chavesDias[objData.getDay()];

            document.getElementById('calendar-day-name').value = nomesDiasSemanas[objData.getDay()];

            const valorSalvo = carteiraValores[idDia] || 0;
            const feedbackBox = document.getElementById('txt-feedback');

            if (valorSalvo > 0) {
                feedbackBox.innerText = "Lucro registrado nesta data: R$ " + valorSalvo.toFixed(2).replace('.', ',');
                feedbackBox.style.color = "#0066ff";
            } else {
                feedbackBox.innerText = "Nenhum lucro encontrado nesta data";
                feedbackBox.style.color = "#666d7a";
            }
        }

        function gravarLucroData() {
            const dataEscolhida = document.getElementById('calendar-select').value;
            const valorInformado = parseFloat(document.getElementById('calendar-money-value').value);

            if (!dataEscolhida || !valorInformado || valorInformado <= 0) {
                alert("Insira um valor de faturamento correto!");
                return;
            }

            const objData = new Date(dataEscolhida + 'T00:00:00');
            const idDia = chavesDias[objData.getDay()];
            const user = localStorage.getItem('sessao_vision') || "padrao";

            carteiraValores[idDia] = valorInformado;
            localStorage.setItem('banco_lucros_' + user, JSON.stringify(carteiraValores));

            checarFaturamentoData();
            alert("Faturamento atualizado com sucesso!");
            document.getElementById('calendar-money-value').value = '';
        }

        function reiniciarTudo() {
            if (confirm("Deseja realmente iniciar uma nova semana? Todos os dias voltarão a R$ 0,00.")) {
                const user = localStorage.getItem('sessao_vision') || "padrao";
                carteiraValores = { dom: 0, seg: 0, ter: 0, qua: 0, qui: 0, sex: 0, sab: 0 };
                localStorage.setItem('banco_lucros_' + user, JSON.stringify(carteiraValores));
                checarFaturamentoData();
                alert("Novo ciclo iniciado!");
