<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Apostas - Login</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
        </div>
        <h1>Mediadores Vision</h1>
        <p class="subtitle" id="sub-pagina">Faça login para acessar o painel</p>

        <div class="auth-tabs">
            <div class="tab active" id="aba-login" onclick="mudarModo('login')">Login</div>
            <div class="tab" id="aba-cadastro" onclick="mudarModo('cadastro')">Cadastrar</div>
        </div>

        <form id="form-login">
            <div class="input-group">
                <input type="text" id="campo-usuario" placeholder="Usuário" required>
            </div>
            <div class="input-group cadastro-only" id="grupo-confirmar" style="display: none;">
                <input type="password" id="campo-confirmar" placeholder="Confirmar Senha">
            </div>
            <div class="input-group">
                <input type="password" id="campo-senha" placeholder="Senha" required>
            </div>
            <button type="button" class="btn-blue" id="botao-principal" onclick="autenticar()">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        let modo = "login";
        function mudarModo(novoModo) {
            modo = novoModo;
            document.getElementById('aba-login').classList.toggle('active', modo === 'login');
            document.getElementById('aba-cadastro').classList.toggle('active', modo === 'cadastro');
            document.getElementById('sub-pagina').innerText = modo === 'login' ? "Faça login para acessar o painel" : "Crie sua conta gratuitamente";
            document.getElementById('botao-principal').innerText = modo === 'login' ? "Entrar no Sistema" : "Criar Nova Conta";
            document.getElementById('grupo-confirmar').style.display = modo === 'login' ? 'none' : 'block';
        }

        function autenticar() {
            const user = document.getElementById('campo-usuario').value;
            if (!user.trim()) return alert("Digite o usuário!");
            localStorage.setItem('vision_user', user);
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
