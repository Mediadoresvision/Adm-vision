<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediadores Vision - Autenticação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: #121318;
            width: 100%;
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid #0066ff;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0, 102, 255, 0.1);
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            object-fit: cover;
            display: block;
        }

        .auth-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .auth-tabs {
            display: flex;
            background: #1c1e24;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            color: #666d7a;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .auth-tab.active {
            background: #0066ff;
            color: white;
        }

        .input-group {
            margin-bottom: 14px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 40px;
            background: #1c1e24;
            border: 1px solid #2d3139;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #0066ff;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666d7a;
            font-size: 14px;
        }

        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            background-color: #0066ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-card">
            <!-- Puxa a logo da pasta local -->
            <img class="auth-logo" src="logo.png" onerror="this.src='https://placehold.co'">
            <h1>Mediadores Vision</h1>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="mudarAbas('login')">Login</div>
                <div class="auth-tab" id="tab-cadastro" onclick="mudarAbas('cadastro')">Cadastrar</div>
            </div>

            <div>
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="auth-user" placeholder="Usuário">
                </div>
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="auth-pass" placeholder="Senha">
                </div>
                
                <button type="button" class="btn-auth-submit" id="btn-text" onclick="entrarSistema()">➔ Entrar</button>
            </div>
        </div>
    </div>

    <script>
        let modo = 'login';

        function mudarAbas(tipo) {
            modo = tipo;
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-cadastro').classList.remove('active');
            
            if (tipo === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('btn-text').innerText = '➔ Entrar';
            } else {
                document.getElementById('tab-cadastro').classList.add('active');
                document.getElementById('btn-text').innerText = '➔ Criar Conta';
            }
        }

        function entrarSistema() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();

            if (!user || !pass) return alert("Preencha todos os campos!");

            if (modo === 'cadastro') {
                localStorage.setItem('user_vision_' + user, pass);
                alert("Conta '" + user + "' criada!\nMude para a aba 'Login' para acessar.");
                mudarAbas('login');
            } else {
                const senhaSalva = localStorage.getItem('user_vision_' + user);
                if (senhaSalva && senhaSalva === pass) {
                    localStorage.setItem('sessao_vision', user);
                    window.location.href = "painel.html";
                } else {
                    alert("Usuário ou senha incorretos!");
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('sessao_vision')) {
                window.location.href = "painel.html";
            }
        });
    </script>
</body>
</html>
