html<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Apostas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .login-card {
            background: #141414;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #1f1f1f;
            text-align: center;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #0066ff;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #666666; font-size: 13px; margin-bottom: 20px; }

        .auth-tabs {
            display: flex;
            background: #080808;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            color: #666666;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .tab.active { background: #0066ff; color: white; }

        .input-group { margin-bottom: 16px; }
        .input-group input {
            width: 100%;
            padding: 14px;
            background: #080808;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 12px;
            background-color: #0066ff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Vision Logo" onerror="this.src='https://placehold.co'">
        </div>
        <h1>Mediadores Vision</h1>
        <p class="subtitle" id="sub-pagina">Faça login para acessar o painel</p>

        <div class="auth-tabs">
            <div class="tab active" id="aba-login" onclick="mudarModo('login')">Login</div>
            <div class="tab" id="aba-cadastro" onclick="mudarModo('cadastro')">Cadastrar</div>
        </div>

        <form id="form-login">
            <div class="input-group">
                <input type="text" id="campo-usuario" placeholder="Usuário" required>
            </div>
            <div class="input-group" id="grupo-confirmar" style="display: none;">
                <input type="password" id="campo-confirmar" placeholder="Confirmar Senha">
            </div>
            <div class="input-group">
                <input type="password" id="campo-senha" placeholder="Senha" required>
            </div>
            <button type="button" class="btn-blue" id="botao-principal" onclick="autenticar()">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        let modo = "login";
        function mudarModo(novoModo) {
            modo = novoModo;
            document.getElementById('aba-login').classList.toggle('active', modo === 'login');
            document.getElementById('aba-cadastro').classList.toggle('active', modo === 'cadastro');
            document.getElementById('sub-pagina').innerText = modo === 'login' ? "Faça login para acessar o painel" : "Crie sua conta gratuitamente";
            document.getElementById('botao-principal').innerText = modo === 'login' ? "Entrar no Sistema" : "Criar Nova Conta";
            document.getElementById('grupo-confirmar').style.display = modo === 'login' ? 'none' : 'block';
        }

        function autenticar() {
            const user = document.getElementById('campo-usuario').value;
            if (!user.trim()) return alert("Digite o usuário!");
            localStorage.setItem('vision_user', user);
            window.location.href = "painel.html";
        }
    </script>
</body>
</html>
